[package]
name = "moviebox_mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "moviebox_mobile"
crate-type = ["cdylib", "rlib"]

[dependencies]
moviebox-tui = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
log = "0.4"

# Standalone workspace so the core's own [profile.release] (panic = "abort") does not apply:
# a Rust panic must never kill the whole Android app.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
